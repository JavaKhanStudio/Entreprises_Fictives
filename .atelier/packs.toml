[tags.inviolia]
label = "Inviolia"
description = "The site of the cybersecurity vendor Inviolia, in inviolia/"
context = """
FILES: 7 pages in inviolia/ (index, a-propos, equipe, organigramme, offre-emploi, communique, contact), inviolia/inviolia.css, inviolia/inviolia.js, inviolia/base.css (a copy, see RULE in #shared). Domain: inviolia.example.
